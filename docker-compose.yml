services:
  app:
    build: .
    restart: unless-stopped
    # A worker env változói (secret is). A .env a VPS-en él, NEM a gitben.
    env_file: .env
    # A Shopify CLI a .env fájlt is olvassa a cwd-ből → biztonsági öv a process env mellé.
    volumes:
      - ./.env:/app/.env:ro
    # Csak localhostra publikálunk — a HOST reverse proxy (Caddy) ide proxyzzon.
    ports:
      - "127.0.0.1:8787:3000"
    networks: [web]

  # Bundolt Caddy CSAK akkor kell, ha a hoston NINCS reverse proxy.
  # Ilyenkor: `docker compose --profile bundled-proxy up -d`.
  # Ha a hoston már fut Caddy/nginx (mint itt), ezt NE indítsd — használd a host proxyt.
  caddy:
    image: caddy:2
    profiles: ["bundled-proxy"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  web: {}

volumes:
  caddy_data: {}
  caddy_config: {}
